# ===================================================================
# GENERAL APPLICATION CONFIGURATION
# ===================================================================
spring.application.name=HireQuick
server.port=8080
server.servlet.context-path=/api/v1

# ===================================================================
# LOCAL DATABASE CONFIGURATION (PostgreSQL)
# ===================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/hire-quick_database
spring.datasource.username=hire-quickUser
spring.datasource.password=hire-quickPassword
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===================================================================
# FLYWAY CONFIGURATION (Database Migrations)
# ===================================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ===================================================================
# MAILHOG CONFIGURATION (Development Email)
# ===================================================================
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===================================================================
# ASYNC TASKS CONFIGURATION (For background email sending)
# ===================================================================
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100

# ===================================================================
# JWT CONFIGURATION (For email verification and password reset)
# ===================================================================
# Replace this secret with the one generated by GenerateSecretKey!
jwt.secret=ZAcBBJSBBQr6gcWNq8egzlnadk4OINdkD/iMNwEZt34=
jwt.expiration.email-verification=86400000
jwt.expiration.password-reset=3600000

# ===================================================================
# LOGGING CONFIGURATION (For debugging)
# ===================================================================
logging.level.root=INFO
logging.level.com.hirequick=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Log pattern for better readability
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n
