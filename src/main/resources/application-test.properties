# Profil test
spring.profiles.active=test

# Hibernate crée le schéma automatiquement à chaque test
spring.jpa.hibernate.ddl-auto=create-drop

# Base H2 en mémoire
spring.datasource.url=jdbc:h2:mem:hirequick_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Flyway désactivé en test (optionnel)
spring.flyway.enabled=false

# Affichage SQL pour débogage
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
